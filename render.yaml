services:
  # 1. Backend Web Service
  - type: web
    name: nutrobot-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: PORT
        value: 5001
      - key: DATABASE_URL
        fromDatabase:
          name: nutrobot-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nutrobot-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false # You will enter this key in the Render dashboard UI

  # 2. Frontend Static Site
  - type: web
    name: nutrobot-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    envVars:
      - key: VITE_API_URL
        sync: false # You will enter the public URL of your backend (e.g., https://nutrobot-backend.onrender.com/api)

  # 3. Redis Cache Instance
  - type: redis
    name: nutrobot-redis
    plan: free
    ipAllowList: [] # Restricts access to internal services only

databases:
  - name: nutrobot-db
    plan: free
